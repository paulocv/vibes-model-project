[project]
name = "vibes-model-project"
version = "0.1.0"
description = "Python scripts for running and postprocessing VIBES simulations (Ventura et al. 2025)."
readme = "README.md"
license = { file = "LICENSE" }
# Option B (frozen environment): same interpreter and package versions as used in the original development.
requires-python = "==3.9.*"
dependencies = [
    "cycler==0.10.0",
    "jupyter==1.0.0",
    "matplotlib==3.4.3",
    "numpy==1.20.3",
    "pandas==1.3.4",
    "pathos==0.2.8",
    "scipy==1.7.1",
    "statsmodels==0.12.2",
    # Imported by toolbox/file_tools.py but previously only installed transitively through jupyter.
    "requests",
]

[tool.uv]
# Collection of scripts run from the repo root, not an installable library.
package = false
